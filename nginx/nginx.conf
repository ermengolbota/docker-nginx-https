server {
    listen 80;
    server_name web.exemple.com;
    return 301 https://$host:8443$request_uri; 
}


server {
    listen 443 ssl;
    server_name web.exemple.com;

    ssl_certificate /etc/nginx/ssl/web.exemple.com.crt;
    ssl_certificate_key /etc/nginx/ssl/web.exemple.com.key;

    index index.html;
    root /usr/share/nginx/html;
}